name: Deploy HK-ELE Teacher to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hkele-teacher-app-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:public
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - name: Build controlled Web/PWA deployment
        run: pnpm run build:web
        env:
          EXPO_PUBLIC_HKELE_ENVIRONMENT: ${{ inputs.environment }}
          EXPO_PUBLIC_HKELE_AI_FILTER_URL: ${{ inputs.environment == 'production' && vars.HKELE_PRODUCTION_AI_FILTER_URL || vars.HKELE_STAGING_AI_FILTER_URL }}
          EXPO_PUBLIC_HKELE_TURNSTILE_SITE_KEY: ${{ inputs.environment == 'production' && vars.HKELE_PRODUCTION_TURNSTILE_SITE_KEY || vars.HKELE_STAGING_TURNSTILE_SITE_KEY }}
          EXPO_PUBLIC_HKELE_RELEASE_CHANNEL: web-${{ inputs.environment }}
          EXPO_PUBLIC_HKELE_ENDPOINT_STATUS: CONFIGURED_BY_MANUAL_GITHUB_ACTIONS_DEPLOYMENT
      - run: pnpm run validate:pwa
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
